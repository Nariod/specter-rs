cargo-features = ["panic-immediate-abort"]

[workspace]
resolver = "2"
members = ["crates/beacon", "crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"
repository = "https://github.com/Nariod/specter-rs"

# Beacon size discipline (see docs/ETUDE-DE-FAISABILITE.md, section 4).
# The final artifact is a raw PIC blob extracted from .text: every byte counts.
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# immediate-abort: a panicking beacon traps inline (ud2) — no formatting,
# no panic strings, no core::fmt machinery in the blob (the nightly
# panic_immediate_abort strategy, promoted to `panic = "immediate-abort"`).
panic = "immediate-abort"
strip = true
overflow-checks = false

# The beacon never unwinds: keep `cargo check`/`cargo build` (dev) working
# with build-std=core, which otherwise rebuilds core with panic=unwind.
[profile.dev]
panic = "abort"


